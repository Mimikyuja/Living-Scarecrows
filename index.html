<title>Living Scarecrow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital@0;1&display=swap">
<style>
:root{--bg:#080d10;--fg:#d8e6d0;--muted:#7f968a;--accent:#e8b44a;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Lora',Georgia,serif;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden}
#wrap{width:min(100%,calc((100vh - 52px) * 16 / 9));aspect-ratio:16/9;max-width:100%}
canvas{width:100%;height:100%;display:block;border-radius:8px;box-shadow:0 0 0 1px #1d2a26,0 18px 50px #000a;background:#000;touch-action:none}
.hint{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
</style>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="hint" id="hint">Teclado: flechas/AD · Espacio saltar · X/J atacar · Shift dash &nbsp;|&nbsp; Mando Xbox: stick/cruceta · A saltar · X atacar · B/RB dash</div>
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=960,H=540,GY=440;cv.width=W*2;cv.height=H*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function ln(a,b,c,d){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()}
function lerpC(c1,c2,t){return `rgb(${c1.map((v,i)=>Math.round(lerp(v,c2[i],t))).join(',')})`}

/* ---------- input: teclado + mando Xbox ---------- */
const keys={};let usingPad=false,clickQ=null;
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;usingPad=false});
const rel={};addEventListener('keyup',e=>{rel[e.code]=true});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();clickQ={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}});
const H_={},P={},prevH={};let padOn=false;
const ACT=['left','right','up','down','jump','attack','dash','ok','back','pause','spell','act'];
function pollInput(){
  let gp=null;try{gp=[...(navigator.getGamepads?navigator.getGamepads():[])].find(g=>g&&g.connected)||null}catch(e){gp=null}
  padOn=!!gp;
  const b=i=>gp&&gp.buttons[i]&&gp.buttons[i].pressed,ax=(i)=>gp?gp.axes[i]||0:0;
  const c={
    left:keys.ArrowLeft||keys.KeyA||ax(0)<-.4||b(14),
    right:keys.ArrowRight||keys.KeyD||ax(0)>.4||b(15),
    up:keys.ArrowUp||keys.KeyW||ax(1)<-.5||b(12),
    down:keys.ArrowDown||keys.KeyS||ax(1)>.5||b(13),
    jump:keys.Space||keys.KeyZ||keys.ArrowUp||keys.KeyW||b(0),
    attack:keys.KeyX||keys.KeyJ||keys.KeyK||b(2),
    spell:keys.KeyV||keys.KeyB||b(3),
    act:keys.KeyE||keys.ArrowDown||keys.KeyS||b(4)||b(13),
    dash:keys.ShiftLeft||keys.ShiftRight||keys.KeyC||b(1)||b(5)||b(7),
    ok:keys.Enter||keys.Space||keys.KeyZ||b(0),
    back:keys.Escape||keys.Backspace||b(1),
    pause:keys.Escape||keys.KeyP||b(9)
  };
  if(gp&&(gp.buttons.some(x=>x.pressed)||Math.abs(ax(0))>.5||Math.abs(ax(1))>.5))usingPad=true;
  for(const k in rel){keys[k]=false;delete rel[k]}
  for(const k of ACT){const v=!!c[k];P[k]=v&&!prevH[k];prevH[k]=v;H_[k]=v}
  if(clickQ){P.ok=true;P.click=clickQ;clickQ=null}else P.click=null;
  P.padOn=padOn;
}
function rumble(d=120,s=.6,w=.8){try{const g=[...navigator.getGamepads()].find(g=>g&&g.connected);g&&g.vibrationActuator&&g.vibrationActuator.playEffect('dual-rumble',{duration:d,strongMagnitude:s,weakMagnitude:w})}catch(e){}}
const btn=(k)=>usingPad?({jump:'A',attack:'X',dash:'B',ok:'A',back:'B',move:'Stick',spell:'Y',act:'LB'})[k]:({jump:'Espacio',attack:'X',dash:'Shift',ok:'Enter',back:'Esc',move:'← →',spell:'V',act:'E'})[k];

/* ---------- audio ---------- */
let AC=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function snd(type,f0,f1,dur,vol=.1,delay=0){const a=ac();if(!a)return;try{const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur)}catch(e){}}
function noise(dur,vol=.12,f=800){const a=ac();if(!a)return;try{const n=a.sampleRate*dur,buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;const g=a.createGain();g.gain.value=vol;s.connect(fl);fl.connect(g);g.connect(a.destination);s.start()}catch(e){}}
const SFX={jump:()=>snd('square',260,520,.12,.04),hit:()=>{snd('sawtooth',220,60,.15,.08);noise(.1,.1,1500)},swing:()=>noise(.09,.05,2500),hurt:()=>{snd('sawtooth',300,80,.3,.12)},dash:()=>noise(.15,.06,1200),
  menu:()=>snd('triangle',520,700,.08,.06),ok:()=>{snd('triangle',440,880,.15,.07)},rustle:()=>noise(.18,.07,2000),
  boom:()=>{snd('sine',90,30,.6,.25);noise(.5,.2,400)},chime:()=>{[660,880,1100,1320].forEach((f,i)=>snd('sine',f,f,.5,.06,i*.1))},talk:()=>snd('triangle',700+Math.random()*300,800,.04,.03)};
let musT=0,musI=0;
function music(dt,mood){ // melodía generativa suave
  if(!AC||AC.state!=='running')return;musT-=dt;if(musT>0)return;
  const sc=mood==='boss'?[110,130.8,146.8,164.8,196,220]:[220,261.6,293.7,329.6,392,440,523.2];
  const f=sc[Math.floor(Math.random()*sc.length)];musI++;
  snd('triangle',f,f*.998,mood==='boss'?.5:1.6,mood==='boss'?.05:.035);
  if(musI%4===0)snd('sine',f/2,f/2,2.4,.05);
  musT=mood==='boss'?.45:(1.1+Math.random()*.9);
}

/* ---------- capas de fondo prerenderizadas ---------- */
const LW=1920;
function mkLayer(h,fn){const c=document.createElement('canvas');c.width=LW;c.height=h;fn(c.getContext('2d'));return c}
const hills=mkLayer(300,g=>{const gr=g.createLinearGradient(0,0,0,300);gr.addColorStop(0,'#2b3d52');gr.addColorStop(1,'#1c2a3a');g.fillStyle=gr;g.beginPath();g.moveTo(0,300);
  for(let x=0;x<=LW;x+=8){const a=x/LW*TAU;const y=150+Math.sin(a*2)*40+Math.sin(a*5+1)*22+Math.sin(a*11)*8;g.lineTo(x,y)}g.lineTo(LW,300);g.fill()});
function treeShape(g,x,base,h,w,col,r){g.fillStyle=col;g.fillRect(x-w*.07,base-h*.4,w*.14,h*.4);
  for(let i=0;i<4;i++){const cy=base-h*.45-i*h*.15,cw=w*(1-i*.2);g.beginPath();g.moveTo(x-cw/2,cy+h*.2);g.quadraticCurveTo(x,cy-h*.16,x+cw/2,cy+h*.2);g.closePath();g.fill()}}
function forestLayer(h,seed,cnt,hmin,hmax,col){const r=mul(seed);return mkLayer(h,g=>{for(let i=0;i<cnt;i++){const x=(i+.2+r()*.6)*LW/cnt,th=hmin+r()*(hmax-hmin);treeShape(g,x,h,th,th*.55,col,r);if(x<120)treeShape(g,x+LW,h,th,th*.55,col,r)}})}
const treesFar=forestLayer(380,7,26,150,260,'#16243a');
const treesMid=forestLayer(440,11,16,230,380,'#0f1a2a');
const trunks=mkLayer(540,g=>{const r=mul(21);for(let i=0;i<7;i++){const x=(i+.3+r()*.4)*LW/7,w=34+r()*44;const gr=g.createLinearGradient(x-w,0,x+w,0);gr.addColorStop(0,'#05090d');gr.addColorStop(1,'#0b1419');g.fillStyle=gr;g.beginPath();g.moveTo(x-w/2,540);g.quadraticCurveTo(x-w*.3,300,x-w*.4,0);g.lineTo(x+w*.4,0);g.quadraticCurveTo(x+w*.3,300,x+w/2,540);g.fill();
  g.strokeStyle='#0a1a14';g.lineWidth=3;for(let k=0;k<5;k++){const vx=x+(r()-.5)*w*.8;g.beginPath();g.moveTo(vx,0);g.bezierCurveTo(vx+10,100,vx-14,140+r()*100,vx+4,200+r()*140);g.stroke()}}});
const stars=(()=>{const r=mul(3),a=[];for(let i=0;i<90;i++)a.push([r()*W,r()*230,r()*1.4+.3,r()*6]);return a})();
function tile(img,par,y){const w=img.width,off=-((cam.x*par)%w);for(let x=off;x<W;x+=w)ctx.drawImage(img,x,y,w,img.height)}
const cam={x:0,sh:0};
const flies=Array.from({length:34},(_,i)=>({x:hash(i)*W,y:200+hash(i+50)*260,p:hash(i+9)*TAU,s:.3+hash(i+4)*.7}));

const mixA=(a,b,t)=>a.map((v,i)=>lerp(v,b[i],t));
function drawBackdrop(z,t,w=0){ // z 0..1 (basurero -> arboleda corrupta)
  const top=lerpC(mixA([20,28,56],[18,34,30],z),[52,36,84],w),mid=lerpC(mixA([54,64,98],[40,70,48],z),[150,86,100],w),bot=lerpC(mixA([120,100,130],[90,120,70],z),[236,156,108],w);
  const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,top);g.addColorStop(.6,mid);g.addColorStop(1,bot);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.globalAlpha=(.4+.6*Math.sin(t*1.5+s[3]))*(1-z*.6);ctx.fillStyle='#fff';ctx.fillRect(s[0],s[1],s[2],s[2])}ctx.globalAlpha=1;
  const mx=740-cam.x*.02,my=110;const mg=ctx.createRadialGradient(mx,my,10,mx,my,170);mg.addColorStop(0,'rgba(255,245,210,.55)');mg.addColorStop(.3,'rgba(255,240,200,.14)');mg.addColorStop(1,'rgba(255,240,200,0)');ctx.fillStyle=mg;ctx.fillRect(mx-200,my-200,400,400);
  ctx.fillStyle=lerpC([250,240,205],[210,235,170],z);ctx.beginPath();ctx.arc(mx,my,34,0,TAU);ctx.fill();ctx.fillStyle='rgba(120,110,100,.25)';[[-10,-6,8],[9,8,6],[4,-14,4]].forEach(c=>{ctx.beginPath();ctx.arc(mx+c[0],my+c[1],c[2],0,TAU);ctx.fill()});
  tile(hills,.08,GY-300+10);tile(treesFar,.18,GY-380+20);
  ctx.fillStyle=`rgba(${Math.round(lerp(70,40,z))},${Math.round(lerp(80,110,z))},${Math.round(lerp(130,70,z))},.25)`;ctx.fillRect(0,GY-150,W,160);
  tile(treesMid,.4,GY-440+30);
}
function drawGround(t){
  const g=ctx.createLinearGradient(0,GY,0,H);g.addColorStop(0,'#26352a');g.addColorStop(.12,'#1a2620');g.addColorStop(1,'#0a100e');ctx.fillStyle=g;ctx.fillRect(0,GY,W,H-GY);
  const x0=Math.floor(cam.x/14)*14;
  for(let x=x0-14;x<cam.x+W+28;x+=14){const h=hash(x*.37);const sx=x-cam.x;const sway=Math.sin(t*1.6+x*.05)*2;
    ctx.strokeStyle=h>.5?'#4f7a45':'#3a6138';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx,GY+2);ctx.quadraticCurveTo(sx+sway,GY-6-h*10,sx+sway*1.6+(h-.5)*8,GY-9-h*14);ctx.stroke();
    if(h>.93){ctx.fillStyle='#e8d98a';ctx.beginPath();ctx.arc(sx+sway,GY-14-h*6,2.4,0,TAU);ctx.fill()}
    if(h<.04){ctx.fillStyle='#6fd0c8';ctx.shadowColor='#6fd0c8';ctx.shadowBlur=10;ctx.beginPath();ctx.ellipse(sx,GY-3,4,3,0,Math.PI,0);ctx.fill();ctx.shadowBlur=0}}
  ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(0,GY,W,2);
}
function drawFore(t,z){
  ctx.globalAlpha=.16;tile(trunks,1.35,-2);ctx.globalAlpha=1;
  const fg=ctx.createLinearGradient(0,GY-60,0,H);fg.addColorStop(0,'rgba(120,150,170,0)');fg.addColorStop(1,'rgba(90,120,130,.18)');ctx.fillStyle=fg;ctx.fillRect(0,GY-60,W,H-GY+60);
  for(const f of flies){const x=((f.x-cam.x*.6)%W+W)%W,y=f.y+Math.sin(t*f.s+f.p)*16;ctx.globalAlpha=.4+.6*Math.sin(t*2*f.s+f.p)**2;ctx.fillStyle=z>.6?'#c7ff7a':'#ffe9a0';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(x,y,1.8,0,TAU);ctx.fill()}
  ctx.globalAlpha=1;ctx.shadowBlur=0;
  const v=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}

/* ---------- personajes ---------- */
function drawScarecrow(x,y,f,o){ // y = pies. o:{t,walk,atk,hurt,air,blink,look}
  ctx.save();ctx.translate(x,y);ctx.scale(f,1);
  if(o.tilt)ctx.rotate(o.tilt);const t=o.t,sw=Math.sin(t*13)*(o.walk||0)*8,bob=Math.abs(Math.sin(t*13))*(o.walk||0)*2.5+(o.air?0:Math.sin(t*2)*.8);
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,0,17,4,0,0,TAU);ctx.fill();
  if(o.hurt&&Math.floor(t*30)%2)ctx.globalAlpha=.45;
  ctx.lineCap='round';ctx.strokeStyle='#4a2f1a';ctx.lineWidth=6;
  const lk=o.air?-5:0;ln(-5,-24,-6+sw,-3+lk);ln(6,-24,7-sw,-3-lk);
  ctx.strokeStyle='#d9b45a';ctx.lineWidth=2;[[-6+sw,-3+lk,-1],[7-sw,-3-lk,1]].forEach(([a,b,d])=>{for(let i=-2;i<=2;i++)ln(a,b,a+d*6+i*2.5,b+4+Math.abs(i))});
  ctx.translate(0,-bob);
  // brazo trasero
  ctx.strokeStyle='#3b2615';ctx.lineWidth=5;ln(-10,-54,-20,-40+Math.sin(t*13)*(o.walk||0)*5);
  // torso
  const bg=ctx.createLinearGradient(-15,0,15,0);bg.addColorStop(0,'#6e4527');bg.addColorStop(.5,'#92603a');bg.addColorStop(1,'#6a4226');
  ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(-14,-58);ctx.quadraticCurveTo(-17,-40,-12,-22);ctx.lineTo(12,-22);ctx.quadraticCurveTo(17,-40,14,-58);ctx.closePath();ctx.fill();
  ctx.fillStyle='#5a7a8a';rr(-8,-46,10,9,2);ctx.fill();ctx.fillStyle='#a04a3a';rr(2,-36,9,8,2);ctx.fill();
  ctx.strokeStyle='#e8d7a0';ctx.lineWidth=1;ctx.setLineDash([2,2]);ctx.strokeRect(-8,-46,10,9);ctx.strokeRect(2,-36,9,8);ctx.setLineDash([]);
  ctx.strokeStyle='#d9b45a';ctx.lineWidth=2;for(let i=-3;i<=3;i++)ln(i*3.5,-22,i*3.8,-17);
  ctx.strokeStyle='#2a1a0e';ctx.lineWidth=3;ln(-13,-30,13,-30);
  // cabeza
  ctx.save();ctx.translate(0,-71+(o.hurt?2:0));ctx.rotate(Math.sin(t*2)*.03+(o.hurt?-.2:0));
  const hg=ctx.createRadialGradient(-4,-4,2,0,0,17);hg.addColorStop(0,'#e3c58c');hg.addColorStop(1,'#b8924f');ctx.fillStyle=hg;ctx.beginPath();ctx.ellipse(0,0,15,16,0,0,TAU);ctx.fill();
  ctx.strokeStyle='#8a6a35';ctx.lineWidth=1;ctx.beginPath();ctx.arc(-6,3,8,.2,1.8);ctx.stroke();
  if(o.mask){ctx.fillStyle='#252a35';ctx.beginPath();ctx.ellipse(0,.5,15.4,16.4,0,0,TAU);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;for(let i=-12;i<=12;i+=3)ln(i,-14,i*1.02,15);ctx.fillStyle='#d8ba7e';ctx.beginPath();ctx.ellipse(0,-2,12.5,5.6,0,0,TAU);ctx.fill()}
  const bl=o.blink?1:0;ctx.fillStyle='#17110a';[[-5,-2],[6,-2]].forEach(([ex,ey])=>{ctx.beginPath();ctx.ellipse(ex,ey,3.6,bl?.7:3.6,0,0,TAU);ctx.fill()});
  if(!bl){ctx.fillStyle='#fff';[[-6,-3.4],[5,-3.4]].forEach(([ex,ey])=>{ctx.beginPath();ctx.arc(ex,ey,1,0,TAU);ctx.fill()});ctx.fillStyle='rgba(255,200,90,.9)';[[-4.6,-1],[6.4,-1]].forEach(([ex,ey])=>{ctx.beginPath();ctx.arc(ex,ey,.8,0,TAU);ctx.fill()})}
  if(!o.mask){ctx.strokeStyle='#3a2410';ctx.lineWidth=1.4;ln(-6,8,7,8);for(let i=-5;i<=6;i+=3)ln(i,6.3,i+.8,9.7)}
  // sombrero
  ctx.fillStyle='#caa24a';ctx.beginPath();ctx.ellipse(0,-11,25,5.5,-.05,0,TAU);ctx.fill();
  const hg2=ctx.createLinearGradient(0,-30,0,-11);hg2.addColorStop(0,'#e0bd62');hg2.addColorStop(1,'#a8822f');ctx.fillStyle=hg2;ctx.beginPath();ctx.moveTo(-13,-11);ctx.quadraticCurveTo(-11,-30,0,-28);ctx.quadraticCurveTo(11,-30,13,-11);ctx.closePath();ctx.fill();
  ctx.fillStyle='#7a2b2b';ctx.fillRect(-13,-16,26,4);ctx.fillStyle='#f2d36b';ctx.beginPath();ctx.arc(9,-17,3.2,0,TAU);ctx.fill();ctx.fillStyle='#d9602f';ctx.beginPath();ctx.arc(9,-17,1.4,0,TAU);ctx.fill();
  ctx.strokeStyle='#d9b45a';ctx.lineWidth=2;for(let i=0;i<4;i++)ln(-22+i*3,-9,-26+i*3.5,-5+i);
  ctx.restore();
  // brazo delantero + palo
  const pa=clamp(o.atk||0,0,1),a=o.atk>0?(o.cmb===1?lerp(1.4,-2.0,pa):o.cmb===2?lerp(-2.7,1.7,pa):lerp(-2.0,1.3,pa)):(-.6+Math.sin(t*13)*(o.walk||0)*.3);
  ctx.save();ctx.translate(10,-53);ctx.rotate(a);ctx.strokeStyle='#3b2615';ctx.lineWidth=5;ln(0,0,18,0);
  ctx.strokeStyle='#d9b45a';ctx.lineWidth=2;for(let i=-1;i<=1;i++)ln(18,0,24,i*3);
  ctx.strokeStyle='#6b4a2a';ctx.lineWidth=4;ln(14,0,48,0);ctx.strokeStyle='#cfd6d8';ctx.lineWidth=2.4;ln(46,0,56,0);
  ctx.fillStyle='#cfd6d8';ctx.beginPath();ctx.moveTo(56,-2);ctx.lineTo(62,0);ctx.lineTo(56,2);ctx.fill();ctx.restore();
  ctx.restore();ctx.globalAlpha=1;
}
function drawSlash(x,y,f,p,c=0){ // arco de ataque
  ctx.save();ctx.translate(x,y);if(c===1)ctx.translate(0,-48);ctx.scale(f*(c===2?1.3:1),c===1?-1:1);ctx.globalAlpha=1-p;
  const g=ctx.createLinearGradient(0,-40,60,20);g.addColorStop(0,'rgba(255,250,220,0)');g.addColorStop(1,'rgba(255,240,170,.95)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(8,-24,58,-1.1,.9);ctx.arc(8,-24,40,.9,-1.1,true);ctx.closePath();ctx.fill();ctx.restore();ctx.globalAlpha=1}

function drawFairy(x,y,t,glow=1){
  const fl=Math.sin(t*28);
  ctx.save();ctx.translate(x,y);
  const g=ctx.createRadialGradient(0,0,0,0,0,46*glow);g.addColorStop(0,'rgba(190,255,235,.8)');g.addColorStop(.3,'rgba(120,230,255,.3)');g.addColorStop(1,'rgba(120,230,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,46*glow,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(210,245,255,.55)';ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=.8;
  [[-1,fl],[1,fl]].forEach(([s,k])=>{ctx.save();ctx.scale(s,1);ctx.rotate(-.5+k*.25);ctx.beginPath();ctx.ellipse(9,-6,12,5,0,0,TAU);ctx.fill();ctx.stroke();ctx.rotate(.9);ctx.beginPath();ctx.ellipse(8,3,8,3.5,0,0,TAU);ctx.fill();ctx.restore()});
